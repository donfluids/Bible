plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.riversresearch'
version = '1.0.0'

// Only the apps with the Malayalam Bible carry the voice: the edition is the build's
// BIBLE_EDITION, or the one the generated project records (plugins/withAndroidRelease.js).
// The others compile a module of the same name with nothing in it, without the library
// that runs the model.
def edition = System.getenv('BIBLE_EDITION') ?: rootProject.findProperty('bible.edition') ?: 'en'
def withVoice = edition in ['ml', 'all']

android {
  namespace "org.riversresearch.biblevoice"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    if (withVoice) consumerProguardFiles 'proguard-rules.pro'
  }
  sourceSets {
    main.java.srcDirs += withVoice ? 'src/voice/java' : 'src/none/java'
  }
}

dependencies {
  if (withVoice) {
    // ONNX Runtime (MIT), which runs the voice's model. Kept at exactly 1.22.0: later
    // versions (seen in 1.29.0) bring telemetry code and ask for the INTERNET and
    // ACCESS_NETWORK_STATE permissions, which this app does not have and must not gain.
    implementation('com.microsoft.onnxruntime:onnxruntime-android') {
      version { strictly '1.22.0' }
    }
  }
}
