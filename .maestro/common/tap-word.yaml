# Taps a word of John 1:1, which opens the word sheet. iOS lists a verse as one element,
# not word by word, so the middle of verse 1 is tapped: every word of that verse is a
# link (the middle one is വചനം, "the Word").
appId: org.riversresearch.bible.malayalam
---
- tapOn: "ആദിയിൽ വചനം ഉണ്ടായിരുന്നു.*"
