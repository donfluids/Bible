# A new install: the four Welcome screens, then the reader with its one-time tip.
appId: org.riversresearch.bible.malayalam
name: Launch past Welcome
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 60000
- takeScreenshot: 01-welcome
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Start reading"
    timeout: 10000
- takeScreenshot: 01-welcome-last
- tapOn: "Start reading"
# The reader, under its one-time tip about the title.
- extendedWaitUntil:
    visible: "Got it"
    timeout: 30000
- takeScreenshot: 01-reader-tip
- tapOn: "Got it"
- extendedWaitUntil:
    visible: ".*, choose passage"
    timeout: 10000
- takeScreenshot: 01-reader
