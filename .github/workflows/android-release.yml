name: Android APK

# Builds a release APK on every push to the main development branch, on manual
# request, and on version tags. Tags also get a GitHub release with both APKs attached.
#
# Signing: add these repository secrets so builds are signed with the release key
# (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64 encoded (base64 -w0 bible-release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with the debug key, which cannot update a
# release-signed install.

on:
  push:
    branches: [ccr-39027e0d-8m0rpn, main]
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. Only a tag build, which publishes a GitHub release, may write.
permissions:
  contents: read

# Actions are pinned to exact commits (the release in the comment), so a moved or
# hijacked tag cannot run new code in a job that holds the signing-key secrets. To
# update one, look up the new release's commit and change both the hash and the comment.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # en = Bible (KJV, WEB); ml = വേദപുസ്തകം (Malayalam, KJV). See src/edition.ts.
        edition: [en, ml]
    env:
      BIBLE_EDITION: ${{ matrix.edition }}
      # A step's own env is not available to its `if`, so the secret's presence is
      # checked here, where every step can see it.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Values go through the environment, not ${{ }} in the script, so quotes or $ in a
        # password cannot break the shell.
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "BIBLE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "BIBLE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BIBLE_KEY_ALIAS=$KEY_ALIAS"
            echo "BIBLE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate the Android project
        env:
          BIBLE_VERSION_CODE: ${{ github.run_number }}
          CI: 1
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        env:
          BIBLE_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          VERSION=$(node -p "require('../app.json').expo.version")
          NAME=$([ "$BIBLE_EDITION" = ml ] && echo Vedapusthakam || echo Bible)
          cp app/build/outputs/apk/release/app-release.apk "../$NAME-$VERSION-build${{ github.run_number }}.apk"
          echo "APK=$NAME-$VERSION-build${{ github.run_number }}.apk" >> "$GITHUB_ENV"

      - name: Report signing
        run: |
          CERTS=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")
          echo "$CERTS" | grep -E 'DN|SHA-256'
          ls -la "$APK"
          # A release must never go out with the debug key: it could not update an installed copy.
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && echo "$CERTS" | grep -q 'CN=Android Debug'; then
            echo "::error::Tag build is signed with the debug key. Add the ANDROID_KEYSTORE_* secrets."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          retention-days: 90

  # Tags get a GitHub release with both APKs. This is the only job that may write to the
  # repository, and it never sees the signing secrets: it only takes the built APKs.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: apks
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: apks/*.apk
          generate_release_notes: true
