name: iPhone build (unsigned)

# Compiles the iPhone app of each edition on a Mac runner, without signing, so a change
# that breaks the iOS side is caught on every push. Each run also keeps the app as an
# unsigned .ipa (a Release build with the Bible text and JavaScript inside, so it runs
# without a computer attached). An iPhone installs it only after a tool such as
# Sideloadly or AltStore signs it with the owner's Apple ID (docs/ios/install-test-build.md).
# A signed build for TestFlight and the App Store comes from EAS Build (docs/ios/README.md),
# or from this workflow once a certificate, a provisioning profile and an App Store
# Connect key are added as secrets.

on:
  push:
    branches: [ccr-39027e0d-8m0rpn, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The four-language app (all) is left out: its database is built, not committed (README).
        edition: [en, ml, ta]
    env:
      BIBLE_EDITION: ${{ matrix.edition }}
      CI: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26
        # expo-modules-jsi's Swift package needs a recent Swift (weak let, Swift 6.2.1 or
        # later), which comes with Xcode 26; the runner's default Xcode is older, so the
        # newest Xcode 26 on the runner is taken.
        run: |
          ls /Applications | grep Xcode
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "no Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version 2>&1 | head -1

      - name: Install dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        run: |
          cd ios
          pod install

      - name: Build (no signing)
        run: |
          set -o pipefail
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "workspace $workspace, scheme $scheme"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build > xcodebuild.log 2>&1 || {
              echo "::group::errors"; grep -E -A 6 "error:|fatal error" xcodebuild.log | head -80; echo "::endgroup::"
              tail -80 xcodebuild.log
              exit 1
            }
          grep -E "BUILD SUCCEEDED|BUILD FAILED" xcodebuild.log
          app=$(find build -name '*.app' -path '*Release-iphoneos*' | head -1)
          echo "built $app"
          du -sh "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Check that React Native came prebuilt
        # When the runner cannot download React Native's prebuilt frameworks, CocoaPods
        # builds them from source and takes the newest Hermes from its stable line, which
        # need not match the hermesc that compiled main.jsbundle; such an app can fail on
        # opening. A build like that is stopped here instead of being kept.
        run: |
          if [ ! -d "$APP_PATH/Frameworks/React.framework" ]; then
            echo "::error::React Native was built from source on this runner (prebuilt download failed); re-run the job."
            exit 1
          fi

      - name: Check the app keeps its promises
        # No link scheme, no loosened transport security, no over-the-air updates, no
        # tracking or reporting kit, nothing collected, no network call in our own code.
        run: node scripts/check-ipa.mjs "$APP_PATH" "$BIBLE_EDITION"

      - name: Package the unsigned .ipa
        # An .ipa is a zip with the app under Payload/; signing tools take it as it is.
        run: |
          version=$(node -p "require('./app.json').expo.version")
          case $BIBLE_EDITION in ml) name=Vedapusthakam ;; ta) name=Vedagamam ;; *) name=Bible ;; esac
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          (cd ipa && zip -qry "../$name-$version-unsigned.ipa" Payload)
          ls -la "$name-$version-unsigned.ipa"
          echo "IPA_NAME=$name-$version-unsigned.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
          # Already compressed; zipping it again gains nothing.
          compression-level: 0
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: xcodebuild-${{ matrix.edition }}.log
          path: xcodebuild.log
          retention-days: 14
